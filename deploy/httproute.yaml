apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: football
  namespace: ace
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ace
      namespace: ace
      sectionName: https
  hostnames:
    - ops.appscode.dev
  rules:
    # Without the trailing slash the page's relative assets would resolve against "/".
    - matches:
        - path:
            type: Exact
            value: /football
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /football/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /football
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: football
          namespace: dev
          port: 80
          weight: 1
