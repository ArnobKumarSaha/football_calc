apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: football-calc
  namespace: football-calc
spec:
  parentRefs:
    - name: lb-gateway
      namespace: gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: football-calc
          port: 8080
